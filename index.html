<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Oscar | AI Product Engineer</title>

    <!-- SEO -->
    <meta name="description" content="Oscar — AI Product Engineer and full-stack developer. I build LLM-powered systems, data pipelines, and the React interfaces people use every day." />
    <meta name="author" content="Oscar" />
    <link rel="canonical" href="https://oscaroca.com" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://oscaroca.com" />
    <meta property="og:title" content="Oscar | AI Product Engineer" />
    <meta property="og:description" content="Full-stack developer specialising in LLM-powered products, data pipelines, and React interfaces. Open to new opportunities." />
    <meta property="og:image" content="https://oscaroca.com/og-preview.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Oscar | AI Product Engineer" />
    <meta name="twitter:description" content="Full-stack developer specialising in LLM-powered products, data pipelines, and React interfaces." />
    <meta name="twitter:image" content="https://oscaroca.com/og-preview.png" />

    <!-- JSON-LD Person schema -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Oscar",
      "url": "https://oscaroca.com",
      "sameAs": [
        "https://github.com/oscaroca",
        "https://www.linkedin.com/in/oscarbj/"
      ],
      "jobTitle": "AI Product Engineer",
      "knowsAbout": ["Python", "React", "TypeScript", "LLM Systems", "Machine Learning", "Full-Stack Development"]
    }
    </script>

    <link rel="stylesheet" href="/src/styles/App.css" />

    <!-- Restore path after GitHub Pages 404 redirect -->
    <script>
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          });
          window.history.replaceState(
            null,
            null,
            decoded.shift() + (decoded.length ? '?' + decoded.join('&') : '') + l.hash,
          );
        }
      })(window.location);
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    <!-- Vite entry point -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
